# MySQL cho môi trường dev: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: lms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lms
      MYSQL_USER: lms
      MYSQL_PASSWORD: lms_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - lms-mysql-data:/var/lib/mysql

volumes:
  lms-mysql-data:
