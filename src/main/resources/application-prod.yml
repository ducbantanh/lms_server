# Profile prod: chạy sau reverse proxy (Nginx/Caddy) có HTTPS.
server:
  address: ${APP_HOST:0.0.0.0}
  forward-headers-strategy: ${APP_FORWARD_HEADERS:native}

app:
  session:
    secure-cookie: ${APP_SECURE_COOKIE:true}
  judge:
    # Triển khai thật: chạy bài sinh viên trong container (cần Docker và image judge/Dockerfile)
    sandbox: ${APP_JUDGE_SANDBOX:docker}
  bootstrap:
    create-demo-student: false

logging:
  level:
    lms: INFO
